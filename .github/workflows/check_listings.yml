name: Check WG listings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          WG_SEARCH_URL: ${{ secrets.WG_SEARCH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit seen_listings.json
        run: |
          git config user.name "housing-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- seen_listings.json; then
            echo "No changes to commit."
          else
            git add seen_listings.json
            git commit -m "Update seen listings [skip ci]"
            git push
          fi
